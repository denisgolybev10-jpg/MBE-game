<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Голубиновка: Последний рубеж</title>
<style>
:root{--bg:#0e1215;--pn:#161c21;--pn2:#1d252b;--ln:#2b363e;--tx:#d9dee1;--mu:#8a98a3;--ac:#e2a63b;--rd:#d65a50;--gn:#5bb07a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
*{box-sizing:border-box}
button{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);padding:5px 10px;border-radius:3px;cursor:pointer;font:inherit}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid var(--ac)}
button.pri{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:600}button.on{border-color:var(--ac);color:var(--ac)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
.hide{display:none!important}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 8vw;background:linear-gradient(90deg,#0e1215 30%,rgba(14,18,21,.55));z-index:5}
#menu h1{font:700 clamp(34px,7vw,76px)/1 Georgia,serif;letter-spacing:.06em;margin:0 0 4px}
#menu p{color:var(--mu);margin:0 0 26px}#menu button{display:block;width:230px;margin:5px 0;padding:10px 14px;text-align:left;font-size:15px}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:6px 10px;background:rgba(14,18,21,.92);border-bottom:1px solid var(--ln);z-index:3;flex-wrap:wrap}
#top b{min-width:118px}.chip{background:var(--pn);border:1px solid var(--ln);padding:2px 8px;border-radius:3px;white-space:nowrap}
#nav{position:fixed;top:44px;left:0;bottom:0;width:112px;display:flex;flex-direction:column;gap:3px;padding:6px;background:rgba(14,18,21,.85);z-index:3;overflow:auto}
#nav button{text-align:left;padding:6px}
#panel,#pinfo,#card{position:fixed;background:var(--pn);border:1px solid var(--ln);border-radius:4px;z-index:3;overflow:auto}
#panel{top:50px;left:122px;width:min(560px,calc(100vw - 132px));max-height:calc(100vh - 62px);padding:12px}
#pinfo{right:12px;bottom:10px;width:310px;max-height:44vh;padding:10px}
#card{right:12px;top:60px;width:300px;padding:14px}
#notes{position:fixed;right:10px;top:50px;width:270px;z-index:4;pointer-events:none}
.nt{background:rgba(22,28,33,.96);border-left:3px solid var(--ac);padding:6px 9px;margin-bottom:5px;border-radius:2px}.nt.w{border-color:var(--rd)}.nt.g{border-color:var(--gn)}
h3{margin:12px 0 6px;font-size:14px;color:var(--ac)}h2{margin:0 0 6px}
table{width:100%;border-collapse:collapse}td,th{padding:3px 5px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:500}
.flag{display:inline-block;width:22px;height:14px;border:1px solid #000;vertical-align:-2px;margin-right:6px}
.mu{color:var(--mu)}.bar{height:5px;background:var(--ln);border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}.x{float:right}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9}
#modal>div{background:var(--pn);border:1px solid var(--ac);padding:18px;width:min(460px,92vw);border-radius:4px}#modal button{display:block;width:100%;margin:6px 0;text-align:left}
.ftree{position:relative;margin:10px 0}.ftree svg{position:absolute;inset:0;width:100%;height:100%}.fn{position:absolute;height:52px;padding:4px 5px;font-size:11px;line-height:1.15;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;cursor:pointer;overflow:hidden}.fn.lock{opacity:.45}.fn.ok{border-color:#d9dee1}.fn.act{border-color:var(--ac);color:var(--ac)}.fn.done{border-color:var(--gn);background:#1c2e24}.fn.sel{outline:2px solid var(--ac)}
@media(max-width:700px){#nav{width:44px;font-size:0}#nav button{font-size:11px}#panel{left:52px}#notes{width:200px}}
</style></head><body>

 dip(){const c=me(),t=G.dt,o=G.c[t];return`<h2>Дипломатия</h2><table><tr><th>Страна</th><th>Отн.</th><th>Статус</th></tr>${G.c.filter(x=>x.alive&&x.i!==G.pi).map(x=>`<tr onclick="A.dtab(${x.i})" style="cursor:pointer;${x.i===t?'background:var(--pn2)':''}"><td>${flag(x.i)}${x.name}</td><td>${c.rel[x.i]}</td><td>${atWar(G.pi,x.i)?'<span style="color:var(--rd)">война</span>':allied(G.pi,x.i)?'союзник':c.trade.includes(x.i)?'торговля':''}</td></tr>`).join('')}</table>
 ${o&&o.alive&&t!==G.pi?`<h3>${o.name}</h3><div class="mu">Сила: ${Math.round(power0(o))} (ваша ${Math.round(power0(c))}) · ПВ у вас: ${Math.floor(c.pp)}</div><div class="row">${Object.keys(DIP).filter(k=>DIP[k].ok(G.pi,t)).map(k=>`<button onclick="A.dip('${k}')">${DIP[k].n}${DIP[k].c?' ('+DIP[k].c+' ПВ)':''}</button>`).join('')}</div>`:'<div class="mu">Выберите страну в списке или на карте</div>'}`},
 stats(){const sc=c=>own(c.i).length*3+c.cf*4+c.mf*5+G.armies.filter(a=>a.o===c.i).reduce((s,a)=>s+str(a),0)*6+c.tech.length*2;const l=G.c.filter(c=>c.alive).map(c=>({c,sc:sc(c)})).sort((a,b)=>b.sc-a.sc);return`<h2>Статистика</h2><table><tr><th>#</th><th>Страна</th><th>Пров.</th><th>Нас.</th><th>ГФ/ВЗ</th><th>Див.</th><th>Потери</th><th>Очки</th></tr>${l.map((e,i)=>{const c=e.c,o=own(c.i);return`<tr style="${c.i===G.pi?'color:var(--ac)':''}"><td>${i+1}</td><td>${flag(c.i)}${c.name}</td><td>${o.length}</td><td>${fmt(o.reduce((s,p)=>s+p.pop,0))}</td><td>${fac(c).cf}/${fac(c).mf}</td><td>${G.armies.filter(a=>a.o===c.i).reduce((s,a)=>s+str(a),0).toFixed(0)}</td><td>${Math.round(c.loss)}</td><td>${Math.round(e.sc)}</td></tr>`}).join('')}</table><div class="mu">Мировые державы: ${l.slice(0,3).map(e=>e.c.name).join(', ')}</div>`},
 world(){const ws=[];G.c.forEach(a=>a.war.forEach(b=>{if(a.i<b)ws.push([a.i,b])}));return`<h2>Мировая ситуация</h2><h3>Войны (${ws.length})</h3>${ws.map(w=>`<div>${flag(w[0])}${nameOf(w[0])} ⚔ ${flag(w[1])}${nameOf(w[1])} <span class="mu">захвачено ${taken(w[0],w[1])}:${taken(w[1],w[0])}</span></div>`).join('')||'<div class="mu">Мир</div>'}<h3>Альянсы</h3>${G.al.filter(a=>a.m.length).map(a=>`<div><b>${a.name}</b> — ${a.m.map(m=>flag(m)+nameOf(m)).join(', ')}</div>`).join('')||'<div class="mu">Нет</div>'}`},
 menu(){return`<h2>Меню</h2><div class="row"><button onclick="A.save(1)">Сохранить в слот 1</button><button onclick="A.save(2)">Слот 2</button><button onclick="A.save(3)">Слот 3</button></div><div class="row"><button onclick="A.load(1)">Загрузить 1</button><button onclick="A.load(2)">2</button><button onclick="A.load(3)">3</button></div><div class="row"><button onclick="A.snd()">Звук: ${SND?'вкл':'выкл'}</button><button onclick="A.toMenu()">В главное меню</button></div><div class="mu">Автосохранение — раз в месяц игрового времени.</div>`}};
const DIP={war:{n:'Объявить войну',ok:(a,b)=>!atWar(a,b)&&!allied(a,b),run:(a,b)=>declare(a,b)},
 peace:{n:'Предложить мир',ok:atWar,run:(a,b)=>aiOK(b,a)?makePeace(a,b):nt('Отказ: '+nameOf(b)+' хочет продолжать войну','w')},
 ally:{n:'Создать альянс / пригласить',c:50,ok:(a,b)=>!allied(a,b)&&!atWar(a,b),run:(a,b)=>{const e=makeAlliance(a,b);if(e)nt(e,'w')}},
 improve:{n:'Улучшить отношения',c:25,ok:(a,b)=>!atWar(a,b),run:(a,b)=>{G.c[a].rel[b]+=15;G.c[b].rel[a]+=15}},
 worsen:{n:'Ухудшить отношения',c:10,ok:(a,b)=>!allied(a,b),run:(a,b)=>{G.c[a].rel[b]-=15;G.c[b].rel[a]-=15}},
 trade:{n:'Торговое соглашение',c:30,ok:(a,b)=>!atWar(a,b)&&!G.c[a].trade.includes(b),run:(a,b)=>{if(G.c[b].rel[a]<-10)return nt('Отказ: плохие отношения','w');G.c[a].trade.push(b);G.c[b].trade.push(a);nt('Торговое соглашение с '+nameOf(b),'g')}},
 aid:{n:'Военная помощь (−10 пех. об.)',ok:(a,b)=>!atWar(a,b),run:(a,b)=>{if(G.c[a].eq.inf<10)return nt('Недостаточно оборудования','w');G.c[a].eq.inf-=10;G.c[b].eq.inf+=10;G.c[b].rel[a]+=10}}};
function refreshAll(){if(!G)return;G.c.forEach(c=>c.alive&&0);dirty=1}
/* ================= ДЕЙСТВИЯ ================= */
const A={
 newGame(){MODE='select';SELC=null;newState();paint();calcLabels();$('#menu').classList.add('hide');$('#card').classList.remove('hide');card();dirty=1},
 start(){G.pi=SELC;G.c[G.pi].ai=false;G.paused=true;MODE='game';$('#card').classList.add('hide');['#top','#nav'].forEach(s=>$(s).classList.remove('hide'));G.tab='country';G.sel=CAP[G.pi];nt('Игра началась. Нажмите ▶, чтобы запустить время','g');ui();dirty=1},
 pause(){G.paused=!G.paused;sfx('click');ui()},speed(n){G.speed=n;G.paused=false;ui()},
 tab(t){G.tab=G.tab===t?null:t;sfx('open');ui()},sel(p){G.sel=p;G.sa=null;ui();dirty=1},
 selA(id,s){G.sa=G.sa===id?null:id;if(s){const a=G.armies.find(x=>x.id===id);if(a)G.sel=a.p}ui();dirty=1},
 law(k,i){const c=me();if(c.laws[k]===i)return;if(c.pp<100)return nt('Нужно 100 ПВ','w');c.pp-=100;c.laws[k]=i;calc(c);ui()},
 line(k,d){const c=me(),used=Object.values(c.lines).reduce((s,v)=>s+v,0);if(d>0&&used>=c.mf)return;if(d<0&&c.lines[k]<=0)return;c.lines[k]+=d;ui()},
 train(k){const e=startTrain(me(),k);if(e)nt(e,'w');ui()},
 build(t){const e=queueBuild(me(),G.sel,t);if(e)nt(e,'w');else sfx('click');ui()},unq(i){me().buildQ.splice(i,1);ui()},
 front(m){const c=me();if(m===0)aiArmies(c);else G.armies.filter(a=>a.o===G.pi).forEach(a=>a.tgt=null);ui();dirty=1},
 research(id){const c=me(),t=CFG.techs.find(x=>x.id===id);c.rs.push({id,left:t.d});sfx('click');ui()},
 focus(id){const c=me(),f=focusesOf(c).find(x=>x.id===id);if(!f||c.focus||c.fdone.includes(id)||!reqOK(c,f))return;c.focus={id,left:f.d};nt('Начат фокус: '+f.n);sfx('click');ui()},
 fsel(id){G.fsel=id;ui()},
 dtab(i){G.dt=i;G.tab='dip';ui()},
 dip(k){const d=DIP[k],c=me();if(d.c&&c.pp<d.c)return nt('Нужно '+d.c+' ПВ','w');if(d.c)c.pp-=d.c;d.run(G.pi,G.dt);ui();dirty=1},
 leave(){leave(G.pi);ui()},snd(){SND=!SND;ui()},
 save(s){save(s);nt('Игра сохранена (слот '+s+')','g');ui()},
 load(s){if(load(s))nt('Игра загружена','g')},
 cont(){if(!load('auto')){const k=[1,2,3].find(i=>localStorage.getItem('golub_'+i));if(!k||!load(k))nt('Нет сохранений','w')}},
 loadMenu(){ask('Загрузка',' ',[1,2,3,'auto'].map(s=>[(s==='auto'?'Автосохранение':'Слот '+s)+(info(s)?' — '+info(s):' — пусто'),()=>{if(!load(s))nt('Пусто','w')}]).concat([['Назад',()=>{}]]))},
 settings(){ask('Настройки','Звук: '+(SND?'включён':'выключен'),[['Переключить звук',()=>{SND=!SND}],['Закрыть',()=>{}]])},
 about(){ask('Голубиновка: Последний рубеж','Прототип глобальной стратегии. Карта — ваша: 21 территория, провинции строятся по жёлтым городам. Данные стран, лор и баланс меняются в блоке CFG в начале скрипта.',[['Понятно',()=>{}]])},
 toMenu(){MODE='menu';G.modal=0;['#top','#nav','#panel','#pinfo','#card'].forEach(s=>$(s).classList.add('hide'));$('#menu').classList.remove('hide');$('#modal').classList.add('hide');dirty=1}};
function card(){const c=SELC==null?null:G.c[SELC],cd=$('#card');if(!c){cd.innerHTML='<h2>Выбор страны</h2><div class="mu">Кликните по любой стране на карте</div><div class="row"><button onclick="A.toMenu()">Назад</button></div>';return}
 const o=own(SELC),f=fac(c),pop=o.reduce((s,p)=>s+p.pop,0),cap=P[CAP[SELC]];
 cd.innerHTML=`<h2>${flag(SELC)}${c.name}</h2><div class="mu">Глава: ${CFG.leader(SELC)} · ${CFG.ideology(SELC)}</div><table><tr><td>Столица</td><td>${cap.city?cityName(cap):'провинция '+(cap.id+1)}</td></tr><tr><td>Провинций</td><td>${o.length}</td></tr><tr><td>Население</td><td>${fmt(pop)}</td></tr><tr><td>Промышленность</td><td>${f.cf} гражд. / ${f.mf} воен.</td></tr><tr><td>Армия</td><td>${G.armies.filter(a=>a.o===SELC).reduce((s,a)=>s+str(a),0)} див.</td></tr><tr><td>Соседи</td><td>${nbrs(c).length}</td></tr><tr><td>Экономика</td><td>${'★'.repeat(Math.max(1,Math.min(5,Math.round(f.cf/4))))}</td></tr></table><div class="row"><button class="pri" onclick="A.start()">Начать игру</button><button onclick="A.toMenu()">Назад</button></div>`}
/* ================= СОХРАНЕНИЕ ================= */
function save(s){try{localStorage.setItem('golub_'+s,JSON.stringify({t:Date.now(),G,pv:P.map(p=>[p.o,p.civ,p.mil,p.dock,p.inf,p.fort,p.air,p.pop])}))}catch(e){}}
function info(s){try{const d=JSON.parse(localStorage.getItem('golub_'+s));return d?new Date(d.t).toLocaleString('ru'):''}catch(e){return''}}
function load(s){try{const d=JSON.parse(localStorage.getItem('golub_'+s));if(!d)return false;G=d.G;G.modal=0;G.paused=true;P.forEach((p,i)=>[p.o,p.civ,p.mil,p.dock,p.inf,p.fort,p.air,p.pop]=d.pv[i]);G.c.forEach(calc);MODE='game';$('#menu').classList.add('hide');$('#card').classList.add('hide');$('#modal').classList.add('hide');['#top','#nav'].forEach(x=>$(x).classList.remove('hide'));paint();calcLabels();ui();dirty=1;return true}catch(e){return false}}
/* ================= ЗАПУСК ================= */
const img=new Image();img.onload=()=>{buildMap(img);fit();newState();paint();calcLabels();requestAnimationFrame(loop)};img.src='data:image/png;base64,'+M.png;
addEventListener('keydown',e=>{if(MODE!=='game'||G.modal)return;if(e.code==='Space'){e.preventDefault();A.pause()}else if(e.key>='1'&&e.key<='5')A.speed(+e.key)});
</script></body></html>
